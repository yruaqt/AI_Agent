server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: olive-agent-starter
  datasource:
    url: jdbc:h2:file:./data/starter;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
app:
  version: 0.1.0
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088}
  jwt-secret: ${JWT_SECRET:abcdefghijklmnopqrstuvwxyz123456}
  jwt-expiration-seconds: 7200
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}
    password: ${DEMO_PASSWORD:123456}

agent:
  task-generation:
    model-timeout-seconds: ${TASK_GENERATION_MODEL_TIMEOUT_SECONDS:25}
    model-max-retries: ${TASK_GENERATION_MODEL_MAX_RETRIES:0}


