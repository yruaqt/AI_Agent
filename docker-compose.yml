services:
  postgres:
    # 官方 pgvector 镜像预装 vector 扩展，能够执行 PostgreSQL 专用 V100 迁移。
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olive_starter}
      POSTGRES_USER: ${POSTGRES_USER:-olive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olive} -d ${POSTGRES_DB:-olive_starter}"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-olive_starter}
      DB_USERNAME: ${POSTGRES_USER:-olive}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-123456}
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "8088:80"
    depends_on:
      - backend
volumes:
  postgres-data:

